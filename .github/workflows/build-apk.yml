name: Build ImagesTo4K Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Static Signing Keystore
      run: |
        mkdir -p keystore
        if [ ! -f keystore/release.jks ]; then
          echo "Generating permanent release.jks..."
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias imagesto4k \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ImagesTo4K, OU=Mobile, O=ProjectFun, C=VN"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystore/release.jks
          git commit -m "chore: persist static release signing keystore" || true
          git push origin main || true
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare APKs for Direct Download
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/*.apk dist/ImagesTo4K-Release.apk
        cp app/build/outputs/apk/debug/*.apk dist/ImagesTo4K-Debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ImagesTo4K-Debug-APK
        path: dist/ImagesTo4K-Debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ImagesTo4K-Release-APK
        path: dist/ImagesTo4K-Release.apk

    - name: Publish GitHub Release (Direct APK Download)
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v1.3.0
        name: "Images to 4K v1.3.0 (Tích hợp Google Gemini Pro Cloud AI)"
        draft: false
        prerelease: false
        body: |
          ## 📱 Tải file APK trực tiếp về điện thoại (Không cần giải nén .zip):
          - 👉 **[Tải ImagesTo4K-Release.apk](https://github.com/congdu28/Images-to-4K/releases/download/v1.3.0/ImagesTo4K-Release.apk)** *(Khuyên dùng để cài đặt)*
          - 👉 **[Tải ImagesTo4K-Debug.apk](https://github.com/congdu28/Images-to-4K/releases/download/v1.3.0/ImagesTo4K-Debug.apk)**

          ### 🌟 Điểm mới nổi bật trong bản v1.3.0:
          - 🌐 **Tích hợp Google Gemini Pro Cloud AI**:
            - Hỗ trợ mô hình cao cấp **Gemini 3 Pro Image (Nano Banana Pro)** & **Gemini 3.1 Flash Image**.
            - Phục chế chi tiết ảnh mờ bằng GPU đám mây của Google mà không làm nóng điện thoại hay tốn pin.
            - Tùy chọn cài đặt API Key an toàn và kiểm tra kết nối trực tiếp trong ứng dụng.
            - Gợi ý prompt chuyên dụng cho ảnh chân dung (mắt/tóc), phong cảnh và khử nhiễu đêm.
          - ⚡ **Chế độ kép linh hoạt (Offline & Online)**: Dễ dàng chuyển đổi giữa chip máy và Gemini Cloud.
          - 🛑 **Nút Hủy xử lý tức thì**: Hỗ trợ hủy nhanh cả tác vụ Offline lẫn tác vụ mạng Gemini Online.
          - 🔄 **Cài đặt đè trực tiếp**: Cài trực tiếp đè lên các bản cũ mà không cần gỡ.
        files: |
          dist/ImagesTo4K-Release.apk
          dist/ImagesTo4K-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

