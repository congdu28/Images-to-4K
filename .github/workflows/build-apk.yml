name: Build ImagesTo4K Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Static Signing Keystore
      run: |
        mkdir -p keystore
        if [ ! -f keystore/release.jks ]; then
          echo "Generating permanent release.jks..."
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias imagesto4k \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=ImagesTo4K, OU=Mobile, O=ProjectFun, C=VN"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystore/release.jks
          git commit -m "chore: persist static release signing keystore" || true
          git push origin main || true
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare APKs for Direct Download
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/*.apk dist/ImagesTo4K-Release.apk
        cp app/build/outputs/apk/debug/*.apk dist/ImagesTo4K-Debug.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ImagesTo4K-Debug-APK
        path: dist/ImagesTo4K-Debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ImagesTo4K-Release-APK
        path: dist/ImagesTo4K-Release.apk

    - name: Publish GitHub Release (Direct APK Download)
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v1.3.1
        name: "Images to 4K v1.3.1 (Tích hợp sẵn Gemini Pro API Key)"
        draft: false
        prerelease: false
        body: |
          ## 📱 Tải file APK trực tiếp về điện thoại (Không cần giải nén .zip):
          - 👉 **[Tải ImagesTo4K-Release.apk](https://github.com/congdu28/Images-to-4K/releases/download/v1.3.1/ImagesTo4K-Release.apk)** *(Khuyên dùng để cài đặt)*
          - 👉 **[Tải ImagesTo4K-Debug.apk](https://github.com/congdu28/Images-to-4K/releases/download/v1.3.1/ImagesTo4K-Debug.apk)**

          ### 🌟 Điểm mới trong bản v1.3.1:
          - 🔑 **Tích hợp sẵn Gemini Pro API Key**: Mã API Key của bạn đã được cấu hình mặc định vào ứng dụng, cài xong là dùng được ngay mà không cần copy/paste.
          - 🌐 **Mặc định kích hoạt chế độ Gemini Pro**: Mở app lên là sẵn sàng phục chế ảnh 4K bằng Google Cloud AI.
          - ⚡ **Chế độ Offline vẫn có sẵn**: Bạn có thể bấm chuyển về Offline bất kỳ lúc nào nếu không có kết nối mạng.
          - 🔄 **Cài đặt đè trực tiếp**: Cài đè trực tiếp lên bản cũ mà không cần gỡ cài đặt.
        files: |
          dist/ImagesTo4K-Release.apk
          dist/ImagesTo4K-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

